  <title id="title">Jabón artesanal de avena y manzanilla</title>
  <desc id="desc">Escena vectorial cálida con una barra marfil de superficie cremosa, banda kraft, espigas de avena, copos y flores secas de manzanilla sobre madera clara.</desc>
