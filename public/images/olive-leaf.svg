<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" role="img" aria-labelledby="title desc">
  <title id="title">Composición botánica de jabones artesanales con una barra de olivo</title>
  <desc id="desc">Escena vectorial cenital sobre madera cálida con una barra verde salvia envuelta en papel kraft, rodeada de jabones pastel, ramas de olivo, pétalos y hierbas secas.</desc>
