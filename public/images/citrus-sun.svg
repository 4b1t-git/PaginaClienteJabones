  <title id="title">Jabón artesanal de cúrcuma y cítricos</title>
  <desc id="desc">Escena vectorial luminosa con una barra amarilla de acabado marmoleado, banda kraft, rodajas secas de naranja, tiras de cáscara y hojas cítricas sobre madera cálida.</desc>
